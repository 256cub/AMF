<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>AMF Bot</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

<header class="top">
    <div class="brand">
        <img src="../icons/icon48.png" alt="" width="28" height="28">
        <div>
            <h1>AMF Bot <span id="version"></span></h1>
            <a href="https://amf.ac/?RZGV0W6M" target="_blank" rel="noopener">AddMeFast.com</a>
        </div>
    </div>
    <button id="toggle" class="primary" type="button">Start</button>
</header>

<section id="status" class="status" role="status" aria-live="polite">
    <span class="dot"></span>
    <span id="status-text">Idle</span>
</section>

<section class="counters" aria-label="This session">
    <div><strong id="c-done">0</strong><span>done</span></div>
    <div><strong id="c-already">0</strong><span>already done</span></div>
    <div><strong id="c-failed">0</strong><span>failed</span></div>
    <div><strong id="c-time">0:00</strong><span>running</span></div>
</section>

<section class="options">
    <label>Max clicks per type
        <input id="max" type="number" min="1" max="500" step="1">
    </label>
    <label title="Stop automatically after this many tasks. 0 means no limit.">Stop after (tasks)
        <input id="session-limit" type="number" min="0" max="100000" step="1">
    </label>
    <div class="bulk">
        <button id="all" type="button">All</button>
        <button id="none" type="button">None</button>
    </div>
</section>

<main id="networks" class="networks"></main>

<details id="log-box">
    <summary>Activity</summary>
    <ol id="log" class="log"></ol>
</details>

<details id="stats-box">
    <summary>Totals <button id="reset-stats" type="button" class="link">reset</button></summary>
    <table id="stats" class="stats"></table>
</details>

<footer>
    <a href="https://github.com/256cub/AMF" target="_blank" rel="noopener">GitHub</a>
    <a href="https://github.com/256cub/AMF/issues" target="_blank" rel="noopener">Report a problem</a>
    <a href="https://discord.gg/2qShbF5xmK" target="_blank" rel="noopener">Discord</a>
</footer>

<script src="../shared/actions.js"></script>
<script src="popup.js"></script>
</body>
</html>
